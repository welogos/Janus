name: Janus CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  validate:
    name: Build, test and container validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Janus.slnx

      - name: Build solution
        run: dotnet build Janus.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Janus.slnx --configuration Release --no-build --verbosity normal

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build --file Janus.Api/Dockerfile --tag janus:ci .
